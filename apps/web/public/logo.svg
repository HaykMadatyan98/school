<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="School 78">
  <defs>
    <linearGradient id="num" x1="50%" y1="8%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2a2118"/>
      <stop offset="42%" stop-color="#6b4423"/>
      <stop offset="78%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <radialGradient id="face" cx="42%" cy="36%" r="68%">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="70%" stop-color="#f3ebe0"/>
      <stop offset="100%" stop-color="#e6d8c4"/>
    </radialGradient>
    <linearGradient id="metal" x1="15%" y1="10%" x2="90%" y2="95%">
      <stop offset="0%" stop-color="#4a4034"/>
      <stop offset="28%" stop-color="#1c1712"/>
      <stop offset="55%" stop-color="#3a3228"/>
      <stop offset="100%" stop-color="#0f0c09"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8d5a8"/>
      <stop offset="45%" stop-color="#b8954a"/>
      <stop offset="100%" stop-color="#7a5c28"/>
    </linearGradient>
    <filter id="lift" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#lift)">
    <!-- outer disc -->
    <circle cx="128" cy="124" r="108" fill="url(#metal)"/>
    <circle cx="128" cy="124" r="103.5" fill="none" stroke="url(#gold)" stroke-width="3.5"/>
    <circle cx="128" cy="124" r="97" fill="none" stroke="#c9a86a" stroke-width="1" opacity="0.45"/>

    <!-- engraved ring pattern -->
    <g fill="none" stroke="#c9a86a" stroke-width="1.1" opacity="0.55">
      <circle cx="128" cy="124" r="90"/>
      <circle cx="128" cy="124" r="86" stroke-dasharray="2.2 3.4"/>
    </g>
    <g fill="#c9a86a" opacity="0.55">
      <circle cx="128" cy="38" r="2.2"/>
      <circle cx="128" cy="210" r="2.2"/>
      <circle cx="42" cy="124" r="2.2"/>
      <circle cx="214" cy="124" r="2.2"/>
      <circle cx="67" cy="63" r="1.8"/>
      <circle cx="189" cy="63" r="1.8"/>
      <circle cx="67" cy="185" r="1.8"/>
      <circle cx="189" cy="185" r="1.8"/>
    </g>

    <!-- top flourishes -->
    <path
      d="M108 36c4-10 12-14 20-14s16 4 20 14"
      fill="none"
      stroke="url(#gold)"
      stroke-width="2.4"
      stroke-linecap="round"
    />
    <path
      d="M114 34c2.5-6 7-9 14-9s11.5 3 14 9"
      fill="none"
      stroke="#e8d5a8"
      stroke-width="1.2"
      stroke-linecap="round"
      opacity="0.7"
    />

    <!-- inner face -->
    <circle cx="128" cy="124" r="74" fill="url(#face)"/>
    <circle cx="128" cy="124" r="74" fill="none" stroke="#c4ad86" stroke-width="1.25"/>

    <!-- 78 -->
    <text
      x="128"
      y="146"
      text-anchor="middle"
      font-family="Georgia, 'Times New Roman', Times, serif"
      font-size="96"
      font-weight="700"
      fill="url(#num)"
      letter-spacing="-3"
    >78</text>

    <!-- bottom nameplate -->
    <path
      d="M86 208
         C96 196 112 190 128 190
         C144 190 160 196 170 208
         L162 222
         C152 214 140 210 128 210
         C116 210 104 214 94 222
         Z"
      fill="url(#metal)"
      stroke="url(#gold)"
      stroke-width="1.4"
    />
    <rect x="108" y="204" width="40" height="3" rx="1.5" fill="#c9a86a" opacity="0.75"/>
  </g>
</svg>
